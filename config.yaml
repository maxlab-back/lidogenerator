# ============================================================================
#  Конфиг лидогенератора. Меняй тут — код трогать не нужно.
# ============================================================================

# Регионы для фан-аута поиска. Поисковики отдают ограниченную выдачу на один
# запрос, поэтому "всю Россию" покрываем, повторяя запросы по городам.
#   []                -> один общероссийский проход (быстро, но узко)
#   "auto:NN"         -> взять топ-NN городов РФ из встроенного списка (parser/cities.py)
#   список городов    -> ровно эти города
# Для всей России рекомендую auto:40 ... auto:80.
regions: "auto:40"

# Поисковые запросы (нишевая воронка с покупательским интентом).
# Город подставляется автоматически из regions. Дальше всё фильтрует классификатор.
queries:
  - подоконник ПВХ в размер купить
  - подоконник пластиковый нарезка по размеру
  - подоконник ПВХ распил под заказ
  - сэндвич-панель для откосов в размер купить
  - сэндвич-панель откосы нарезка по размеру
  - откосы пластиковые сэндвич панель производство

# ------------------------------------------------------------------
#  Типы лидов и правила классификации (скоринг по ключевым словам).
#  any  — хотя бы одно слово должно встретиться (название/рубрика/сайт)
#  must — без этих слов компания НЕ попадёт в этот тип (логика И)
#  boost — слова, повышающие уверенность (явный признак "в размер")
#  block — слова-исключения (отсекаем мусор)
# ------------------------------------------------------------------
lead_types:
  podokonnik_pvh:
    title: "Подоконник"
    must:
      - подоконник
    any:
      - пвх
      - пластик
      - пластиков
    boost:
      - в размер
      - по размеру
      - в нарезку
      - нарезка
      - распил
      - порезка
      - под заказ
      - на заказ
      - резка
      - в нужный размер
      - по вашим размерам
    block:
      - деревянн
      - камень
      - мрамор
      - гранит
      - кварц
      - столешниц
      - сайдинг        # фасадный сайдинг / ДПК / террасная доска — не наша ниша
      - дпк
      - террасн
      - фасадн

  sandwich_otkos:
    title: "Откосы"
    must: []          # любое из any достаточно
    any:
      - сэндвич
      - сендвич
      - сэндвич-панель
      - сендвич-панель
    boost:
      - откос
      - в размер
      - по размеру
      - в нарезку
      - нарезка
      - распил
      - порезка
      - под заказ
      - на заказ
    block:
      - кровельн
      - фасадн
      - стеновая панель для здани
      - ангар
      - холодильн
      - сайдинг
      - дпк
      - террасн

# Порог уверенности (0..1). Ниже порога — лид уходит в "maybe" на ручную проверку.
score_threshold: 0.45

# ------------------------------------------------------------------
#  Источники данных
# ------------------------------------------------------------------
sources:
  search:
    enabled: true
    # backend: duckduckgo (без ключа) | google_cse | serper | yandex_xml
    backend: serper
    results_per_query: 25  # сколько ссылок брать из выдачи на один запрос
    max_sites: 700         # потолок уникальных доменов на весь прогон
    request_delay: 1.0     # пауза между поисками, сек (для serper можно 1.0)
  apify:
    # ВНИМАНИЕ: актор m_mamaev/2gis-places-scraper платный (PAY_PER_EVENT) —
    # бесплатный/триальный аккаунт Apify его не запускает (HTTP 403). Включай только
    # с подключённым биллингом Apify, либо подставь бесплатный 2ГИС-актор в поле actor.
    enabled: false         # парсер 2ГИС через Apify. Нужен APIFY_TOKEN + платный план
    actor: m_mamaev/2gis-places-scraper
    max_items_per_city: 120  # потолок организаций на город (следи за расходом кредитов $5/мес)
    max_cities: 12         # Apify платный: гоняем только топ-N городов (0 = все из regions)
    language: ru
    domain: 2gis.ru
  website_enrich:
    enabled: true          # заходить на сайты и тащить контакты/город/подтверждать нишу
    max_workers: 12
    timeout: 12
    max_pages_per_site: 5  # главная + контакты + о компании + услуги + каталог
  dadata:
    enabled: false         # юр.данные (ИНН/ОГРН/ОКВЭД/руководитель) в выгрузке не нужны — выключено.
    max_workers: 5         # включить: enabled=true + добавить колонки обратно в parser/models.py:COLUMNS

# ------------------------------------------------------------------
#  Выгрузка
# ------------------------------------------------------------------
output:
  dir: output
  excel: true              # один .xlsx с вкладками по типам лидов
  csv: true                # отдельные .csv по каждому типу
  include_maybe: true      # выгружать ли "под вопросом" (ниже порога) отдельной вкладкой

# ------------------------------------------------------------------
#  Универсальный режим (веб-интерфейс, python app.py)
# ------------------------------------------------------------------
universal:
  db: output/leads.db        # база лидов: копится между поисками
  cache_days: 7              # ответы Serper/Яндекса/карт кешируются — повторный поиск без трат
  ai:                        # ИИ-проверка сайтов и генерация запросов (нужен ANTHROPIC_API_KEY)
    model: claude-opus-5     # дешевле: claude-sonnet-5 или claude-haiku-4-5
    effort: low              # классификации хватает low; для генерации запросов берётся medium
    workers: 6
    min_score: 0.3           # ИИ смотрит только сайты с базовой релевантностью от порога
    max_chars: 6000          # сколько текста сайта отдавать ИИ
    price_in: 5.0            # $ за 1M входных токенов — для подсчёта расходов в интерфейсе
    price_out: 25.0          # $ за 1M выходных токенов
  apify:                     # карты через Apify (нужен APIFY_TOKEN)
    yandex_maps_actor: zen-studio/yandex-maps-scraper
    twogis_actor: m_mamaev/2gis-places-scraper   # платный актор: на бесплатном плане Apify даст 403
    price_per_1000:          # $ за 1000 организаций — для сметы
      yandex_maps: 6.99
      2gis: 5.0
  render:                    # JS-сайты через headless Chromium
    enabled: true
    chrome_path: ""          # пусто = найти автоматически
    max_parallel: 3
  proxies: []                # ["http://user:pass@host:port", ...] — ротация при обходе сайтов
  telegram:                  # Telegram-каналы через поиск site:t.me (аккаунт не нужен)
    max_subscribers: 50000   # крупнее — это медиа и городские паблики, а не компании

# Сетевые настройки
network:
  # реальный браузерный UA — чтобы WAF/Cloudflare не резали как бота
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
